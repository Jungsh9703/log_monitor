# Drop-in override for the apt-installed loki.service, so it 1) expands
# ${AZURE_STORAGE_...} env vars in /etc/loki/config.yml and 2) loads those
# vars from /etc/loki/loki.env.
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/loki.service.d
#   sudo cp systemd/loki-override.conf /etc/systemd/system/loki.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart loki

[Service]
EnvironmentFile=/etc/loki/loki.env
ExecStart=
ExecStart=/usr/bin/loki -config.file=/etc/loki/config.yml -config.expand-env=true
