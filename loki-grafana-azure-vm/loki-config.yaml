auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Loki's chunks + index live in Azure Blob Storage instead of local disk --
# the container's own filesystem only holds a boltdb-shipper scratch cache.
# ${...} values are expanded from the environment at startup (loki is run
# with -config.expand-env=true; see docker-compose.yml's env_file: .env).
storage_config:
  azure:
    account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
    account_key: ${AZURE_STORAGE_ACCOUNT_KEY}
    container_name: ${AZURE_STORAGE_CONTAINER_NAME}
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: azure

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: azure
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  shared_store: azure
