services:
  loki:
    image: grafana/loki:2.9.6
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    env_file: .env
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-scratch:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    env_file: .env
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

  # Outbound-only connection to Cloudflare -- no inbound port needs to be
  # opened in the Azure NSG for either Loki's push endpoint or Grafana's UI.
  # Public hostnames + routing are configured in the Zero Trust dashboard
  # (Networks > Tunnels), not here; this container just authenticates with
  # TUNNEL_TOKEN and connects.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - loki
      - grafana
    restart: unless-stopped

volumes:
  loki-scratch:
  grafana-data:
