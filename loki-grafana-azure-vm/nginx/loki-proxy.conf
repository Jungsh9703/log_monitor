# Install with:
#   sudo cp nginx/loki-proxy.conf /etc/nginx/sites-available/loki-proxy.conf
#   sudo ln -s /etc/nginx/sites-available/loki-proxy.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # avoid it catching port 80 traffic
#   sudo htpasswd -c /etc/nginx/.htpasswd loki-pusher   # first user; drop -c for additional users
#   sudo nginx -t && sudo systemctl reload nginx
#
# Loki itself has no built-in authentication, so this is the only thing
# standing between the public internet and the Loki push API. The Worker's
# LOKI_URL should point at http://<vm-public-ip>:3100/loki/api/v1/push with
# LOKI_USERNAME/LOKI_API_KEY set to whatever you pick here.
#
# This is plain HTTP, not HTTPS -- acceptable as a first working version
# since there's no domain to get a real TLS cert for, but it does mean the
# Basic Auth credentials and log content travel in cleartext. See the
# README's "보안 강화" section for how to add TLS later (e.g. via nip.io +
# certbot) or restrict the Azure NSG's inbound rule for this port to
# Cloudflare's published IP ranges (https://www.cloudflare.com/ips/) instead
# of 0.0.0.0/0, since only the Worker needs to reach it.

server {
    listen 3100;
    listen [::]:3100;

    location / {
        auth_basic "Loki push";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Logpush batches shipped in bulk can be sizeable.
        client_max_body_size 20m;
    }
}
