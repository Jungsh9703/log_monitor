auth_enabled: false

server:
  # Bound to localhost only -- nginx (see nginx/loki-proxy.conf) is the only
  # thing allowed to reach Loki directly, listening on the public port (3100)
  # with Basic Auth in front. Loki itself has no built-in auth.
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096

common:
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Loki's chunks + index live in Azure Blob Storage instead of local disk --
# the VM's own filesystem only holds a tsdb-shipper scratch cache under
# /var/lib/loki. The account_name/account_key/container_name values below
# are placeholders expanded from the environment at startup -- see
# systemd/loki-override.conf, which adds -config.expand-env=true and an
# EnvironmentFile pointing at /etc/loki/loki.env. NOTE: expand-env scans the
# whole file as text, including comments -- never write a literal dollar
# sign followed by braces in a comment here, or Loki will fail to parse it.
#
# Uses tsdb_shipper (Loki 3.x's index format), not the deprecated
# boltdb_shipper/shared_store from Loki 2.x -- Loki 3.x removed the
# shared_store field entirely (chunks and index for a schema period now
# always share the single object_store named in schema_config).
storage_config:
  azure:
    account_name: ${AZURE_STORAGE_ACCOUNT_NAME}
    account_key: ${AZURE_STORAGE_ACCOUNT_KEY}
    container_name: ${AZURE_STORAGE_CONTAINER_NAME}
    use_managed_identity: false
  tsdb_shipper:
    active_index_directory: /var/lib/loki/tsdb-shipper-active
    cache_location: /var/lib/loki/tsdb-shipper-cache
    cache_ttl: 24h

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: azure
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /var/lib/loki/compactor
