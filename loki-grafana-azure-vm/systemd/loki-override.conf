# Drop-in override for the apt-installed loki.service, so it 1) expands
# ${AZURE_STORAGE_...} env vars in /etc/loki/config.yml, 2) loads those vars
# from /etc/loki/loki.env, and 3) runs with a sane working directory (some
# Loki modules default to paths relative to CWD, which is otherwise `/`
# under systemd -- Loki has no permission to create anything there).
#
# Install with:
#   sudo mkdir -p /etc/systemd/system/loki.service.d
#   sudo cp systemd/loki-override.conf /etc/systemd/system/loki.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart loki

[Service]
WorkingDirectory=/var/lib/loki
EnvironmentFile=/etc/loki/loki.env
ExecStart=
ExecStart=/usr/bin/loki -config.file=/etc/loki/config.yml -config.expand-env=true
